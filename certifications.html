<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Certifications</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

  <!-- Header -->
  <header class="max-w-7xl mx-auto px-6 py-8 text-center">
    <h1 class="text-3xl font-bold">Certifications</h1>
    <p class="text-gray-600 mt-2">Academic & Professional Achievements</p>
  </header>

  <!-- Back Button -->
  <div id="backBtn" class="text-center mb-6 hidden">
    <a href="certifications.html"
       class="inline-block px-4 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700 transition">
      ← View All Certifications
    </a>
  </div>

  <!-- Certifications Grid -->
  <main class="max-w-7xl mx-auto px-6 pb-12">
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">

      <!-- Dean Lister 1 -->
      <div class="certificate-card bg-white rounded-xl shadow-md"
           data-group="dean-lister">
        <img src="dean1.jpg" class="w-full h-48 object-cover">
        <div class="p-4">
          <h3 class="font-semibold">Dean Lister (1st Sem)</h3>
          <p class="text-sm text-gray-600">University of Makati</p>
        </div>
      </div>

      <!-- Dean Lister 2 -->
      <div class="certificate-card bg-white rounded-xl shadow-md"
           data-group="dean-lister">
        <img src="dean2.jpg" class="w-full h-48 object-cover">
        <div class="p-4">
          <h3 class="font-semibold">Dean Lister (2nd Sem)</h3>
          <p class="text-sm text-gray-600">University of Makati</p>
        </div>
      </div>

      <!-- Dean Lister 3 -->
      <div class="certificate-card bg-white rounded-xl shadow-md"
           data-group="dean-lister">
        <img src="dean3.jpg" class="w-full h-48 object-cover">
        <div class="p-4">
          <h3 class="font-semibold">Dean Lister (3rd Sem)</h3>
          <p class="text-sm text-gray-600">University of Makati</p>
        </div>
      </div>

      <!-- Other Certificate -->
      <div class="certificate-card bg-white rounded-xl shadow-md"
           data-group="web-dev">
        <img src="web-dev.jpg" class="w-full h-48 object-cover">
        <div class="p-4">
          <h3 class="font-semibold">Web Development</h3>
          <p class="text-sm text-gray-600">Online Course</p>
        </div>
      </div>

    </div>
  </main>

  <!-- Filter Script -->
  <script>
    const params = new URLSearchParams(window.location.search);
    const group = params.get('group');

    if (group) {
      document.getElementById('backBtn').classList.remove('hidden');

      document.querySelectorAll('.certificate-card').forEach(card => {
        if (card.dataset.group !== group) {
          card.style.display = 'none';
        }
      });
    }
  </script>

</body>
</html>
